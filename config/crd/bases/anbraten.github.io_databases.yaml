---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: databases.anbraten.github.io
spec:
  group: anbraten.github.io
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    singular: database
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Database is the Schema for the databases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseSpec defines the desired state of Database
            properties:
              database:
                description: Name of the database
                type: string
              password:
                description: Password of the database user
                type: string
              postgres:
                description: Postgres specific settings (only allowed if type is postgres)
                properties:
                  extensions:
                    description: |-
                      Extensions which will be created in the database (e.g. vector, postgis, pg_trgm).
                      The extensions have to be installed on the postgres server.
                      Extensions removed from this list are not dropped from the database, as this would delete all data using them.
                    items:
                      pattern: ^[a-zA-Z0-9]+?[a-zA-Z0-9_-]*?$
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                type: object
              type:
                description: 'Type of the database. (currently supported: mysql, couchdb,
                  mongo, postgres, mssql)'
                type: string
              username:
                description: Username of the database user which will have full access
                  to this database
                type: string
            type: object
            x-kubernetes-validations:
            - message: postgres can only be set if type is postgres
              rule: '!has(self.postgres) || (has(self.type) && self.type == ''postgres'')'
          status:
            description: DatabaseStatus defines the observed state of Database
            properties:
              created:
                description: Has database been created?
                type: boolean
            required:
            - created
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
