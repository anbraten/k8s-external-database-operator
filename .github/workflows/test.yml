name: Go Test

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Test adapters
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Start containers
        run: docker compose up -d --wait

      - name: Test adapters
        run: go test -v -race ./adapters/...

      - name: Stop containers
        if: always()
        run: docker compose down

  check-manifests:
    name: Check if latest manifests have been generated
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test manifest for un-commited changes
        run: |
          export IMG="anbraten/external-database-operator:0.0.1"
          make generate-manifests
          git diff --exit-code -- deploy/external-database-controller.yml config/

  test-build:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build container images
        run: |
          export IMG="anbraten/external-database-operator:0.0.1"
          make build
          make docker-build
